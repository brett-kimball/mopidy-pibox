# Nginx reverse proxy configuration for mopidy-pibox
# Makes localhost:6680/pibox accessible at http://m.internal.phyc.org/
#
# Install: sudo ln -s /path/to/m.internal.phyc.org.conf /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

upstream mopidy_backend {
    server 127.0.0.1:6680;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name m.internal.phyc.org;

    # Logging
    access_log /var/log/nginx/pibox_access.log;
    error_log /var/log/nginx/pibox_error.log;

    # Pass through /pibox paths directly (assets, manifest, etc are built with /pibox prefix)
    location /pibox/ {
        proxy_pass http://mopidy_backend/pibox/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Handle WebSocket upgrades
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Mopidy JSON-RPC WebSocket (used by pibox internally)
    location /mopidy/ws {
        proxy_pass http://mopidy_backend/mopidy/ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket specific settings
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Mopidy JSON-RPC HTTP endpoint
    location /mopidy/rpc {
        proxy_pass http://mopidy_backend/mopidy/rpc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect root to /pibox
    location = / {
        return 302 /pibox;
    }

    # Catch-all: redirect anything else to /pibox
    location / {
        return 302 /pibox$request_uri;
    }
}
